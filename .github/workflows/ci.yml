name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: the workflow only needs to read the repository
permissions:
  contents: read

# Cancel superseded runs of the same branch or PR
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # The tests start their own PostgreSQL with Testcontainers
      - name: Build and test
        run: ./mvnw -B verify

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from the "packageManager" field of package.json
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The lint scripts use --fix, so fail if they had to change any file
      - name: Lint
        run: |
          pnpm lint
          git diff --exit-code

      - name: Build (includes type check)
        run: pnpm build

      - name: Unit tests
        run: pnpm test:unit --run

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: e2e/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            e2e/pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - name: Install the dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir ../frontend install --frozen-lockfile

      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Start PostgreSQL and the mail server
        run: pnpm services:up

      - name: Run the end-to-end tests
        run: pnpm test

      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
