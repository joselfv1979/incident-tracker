spring.application.name=backend
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:1h}

app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
# Without an SMTP server the mail health check would report DOWN
management.health.mail.enabled=false

app.mail.from=${MAIL_FROM:no-reply@incident-tracker.local}
app.mail.verification-url=${APP_BASE_URL:http://localhost:5173}/verify-email

app.verification.token-ttl=${VERIFICATION_TOKEN_TTL:24h}
app.verification.resend-cooldown=${VERIFICATION_RESEND_COOLDOWN:60s}
