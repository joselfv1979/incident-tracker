spring.application.name=backend
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:1h}

app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
# Without an SMTP server the mail health check would report DOWN
management.health.mail.enabled=false

app.mail.from=${MAIL_FROM:no-reply@incident-tracker.local}
app.mail.verification-url=${APP_BASE_URL:http://localhost:5173}/verify-email

app.verification.token-ttl=${VERIFICATION_TOKEN_TTL:24h}
app.verification.resend-cooldown=${VERIFICATION_RESEND_COOLDOWN:60s}

# API documentation (OpenAPI and Swagger UI). Set API_DOCS_ENABLED=false to turn it off
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html

# Rate limiting. Counters live in memory: they reset on restart and are not shared
# between instances.
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
# Per client address
app.rate-limit.login.limit=20
app.rate-limit.login.window=5m
app.rate-limit.register.limit=5
app.rate-limit.register.window=1h
app.rate-limit.resend.limit=5
app.rate-limit.resend.window=1h
app.rate-limit.verify.limit=20
app.rate-limit.verify.window=1h
# Failed logins per account
app.rate-limit.failed-login.limit=10
app.rate-limit.failed-login.window=15m
